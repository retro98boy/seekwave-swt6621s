PACKAGE_NAME="seekwave-swt6621s"
PACKAGE_VERSION="1.0.0"

AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
CONFIG_SEEKWAVE_BSP_DRIVERS=m \
CONFIG_SKW_NO_CONFIG=y \
CONFIG_SKW_SDIOHAL=m \
CONFIG_WLAN_VENDOR_SWT6621S=m \
CONFIG_SKW_BT=m \
CONFIG_SWT6621S_LOG_DEBUG=y \
modules"

CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="skw_sdio_lite"
BUILT_MODULE_LOCATION[0]="drivers/seekwaveplatform_lite"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="swt6621s_wifi"
BUILT_MODULE_LOCATION[1]="drivers/swt6621s_wifi"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="skwbt"
BUILT_MODULE_LOCATION[2]="drivers/swtbt4l"
DEST_MODULE_LOCATION[2]="/updates/dkms"
